apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-rust
  labels:
    app: ecommerce-rust
spec:
  # Jumlah replika diatur oleh HPA (hpa.yaml). Field `replicas` sengaja tidak ditulis supaya
  # ArgoCD (selfHeal) tidak melawan HPA dengan mengembalikan jumlahnya.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # pod lama baru dimatikan setelah pod baru ready → zero downtime saat demo
  selector:
    matchLabels:
      app: ecommerce-rust
  template:
    metadata:
      labels:
        app: ecommerce-rust
    spec:
      nodeSelector:
        kubernetes.civo.com/civo-node-pool: app-pool
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Tag di-update otomatis oleh Jenkins (stage "GitOps: Update Manifest").
          image: ghcr.io/dev-cer/ecommerce-app:1-3ac931a
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PGUSER
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: username } }
            - name: PGPASSWORD
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: password } }
            - name: PGDATABASE
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: database } }
            - name: DATABASE_URL
              value: postgres://$(PGUSER):$(PGPASSWORD)@postgres:5432/$(PGDATABASE)
            # Berat komputasi /api/recommendations (±3 ms CPU per request); dipakai profil k6 "scale".
            - name: RECO_WORK
              value: "100000"
            # Statistik live hero storefront (Replika · Node · Req/detik) via GET /api/live.
            # Service Prometheus dari release Helm "kcd-monitoring" (kube-prometheus-stack, ACT 3);
            # cek dengan: kubectl get svc -n monitoring. Belum terpasang → storefront fallback ke
            # statistik katalog.
            - name: PROMETHEUS_URL
              value: http://kcd-monitoring-kube-promet-prometheus.monitoring.svc:9090
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              # Basis HPA (target 15% = ±37m/pod). Satu node app-pool muat ±6 pod x 250m, jadi begitu
              # HPA meminta >±18 pod, pod baru tidak muat di 3 node -> Pending -> Cluster Autoscaler
              # menambah node sampai maxSize 4 (maxReplicas 30 sengaja melebihi kapasitas 4 node).
              cpu: 250m
              memory: 32Mi
            limits:
              cpu: 1000m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
