apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-rust
  labels:
    app: ecommerce-rust
spec:
  # 1 replika: state order disimpan in-memory, jadi multi-replika membuat statistik tidak konsisten.
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # pod lama baru dimatikan setelah pod baru ready → zero downtime saat demo
  selector:
    matchLabels:
      app: ecommerce-rust
  template:
    metadata:
      labels:
        app: ecommerce-rust
    spec:
      imagePullSecrets:
        - name: ghcr-creds
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Tag di-update otomatis oleh Jenkins (stage "GitOps: Update Manifest").
          image: ghcr.io/dev-cer/ecommerce-app:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
