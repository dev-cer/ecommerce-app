                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "count(kube_node_info)",
              "instant": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "min": 0,
              "color": {
                "mode": "thresholds"
              },
              "thresholds": {
                "mode": "percentage",
                "steps": [
                  {
                    "color": "#3fb27f",
                    "value": null
                  },
                  {
                    "color": "#f2a33a",
                    "value": 75
                  },
                  {
                    "color": "#e5484d",
                    "value": 90
                  }
                ]
              },
              "max": 32
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "showThresholdMarkers": false,
            "showThresholdLabels": false,
            "sizing": "auto",
            "minVizHeight": 120,
            "minVizWidth": 120,
            "text": {
              "valueSize": 40
            }
          }
        },
