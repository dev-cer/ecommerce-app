# Dashboard "Civo Quota & Kapasitas Klaster" (dibuat oleh deploy/dashboards/civo_quota.py, jangan edit manual).
# Dimuat otomatis oleh sidecar Grafana kube-prometheus-stack (label grafana_dashboard).
apiVersion: v1
kind: ConfigMap
metadata:
  name: civo-quota-dashboard
  labels:
    grafana_dashboard: "1"
data:
  civo-quota.json: |
    {
      "title": "Civo Quota & Kapasitas Klaster",
      "uid": "civo-quota",
      "tags": [
        "kcd",
        "civo",
        "capacity"
      ],
      "timezone": "browser",
      "refresh": "10s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "schemaVersion": 39,
      "graphTooltip": 0,
      "templating": {
        "list": [
          {
            "name": "pool",
            "label": "Node pool",
            "type": "query",
            "datasource": {
              "type": "prometheus",
              "uid": "prometheus"
            },
            "query": {
              "query": "label_values(kube_node_labels, label_kubernetes_civo_com_civo_node_pool)",
              "refId": "pool"
            },
            "definition": "label_values(kube_node_labels, label_kubernetes_civo_com_civo_node_pool)",
            "refresh": 2,
            "multi": true,
            "includeAll": true,
            "current": {
              "selected": true,
              "text": [
                "All"
              ],
              "value": [
                "$__all"
              ]
            },
            "sort": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "row",
          "title": "Kuota akun Civo · pemakaian klaster ini (batas = kuota akun di Civo → Settings → Quota)",
