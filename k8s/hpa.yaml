# Autoscaling aplikasi: bisa multi-replika karena state ada di PostgreSQL.
# Pantau saat stress test: kubectl get hpa ecommerce-rust -w
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecommerce-rust
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecommerce-rust
  minReplicas: 2
  # Kapasitas app-pool ±6 pod x 250m per node: 3 node ±18 pod, 4 node (maxSize Cluster Autoscaler)
  # ±24 pod. 30 replika sengaja melebihi 4 node supaya app-pool selalu terisi sampai maxSize;
  # sisa pod Pending di puncak tidak berbahaya dan hilang begitu beban turun.
  maxReplicas: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # 15% dari request 250m = ±37m/pod. Dengan target 30% sebelumnya, beban riil dari satu laptop
          # k6 hanya cukup untuk ±3 node. Sekarang ±0,7 core beban sudah butuh >18 pod (lebih dari 3
          # node) dan ±1,1 core mencapai 30 pod -> Cluster Autoscaler naik sampai 4 node.
          averageUtilization: 15
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        # Agresif agar lonjakan terlihat di panggung.
        - type: Pods
          value: 8
          periodSeconds: 15
    scaleDown:
      # Cukup singkat agar audience melihat pod turun lagi setelah stress test selesai.
      stabilizationWindowSeconds: 60
      policies:
        # Separuh replika per 30 detik: 25 -> 2 dalam ±2 menit, lalu node berlebih dilepas autoscaler.
        - type: Percent
          value: 50
          periodSeconds: 30
