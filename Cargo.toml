[package]
name = "app-repo"
version = "0.2.0"
edition = "2024"

# Dependency sengaja minimal (tokio-postgres tanpa macro/ORM, tanpa tracing/tower-http) agar build dingin di CI cepat.
[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
# Build lebih cepat (penting untuk pipeline demo); performa tetap jauh di atas kebutuhan load test.
codegen-units = 16
incremental = false
