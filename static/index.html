<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NusaMart · Demo</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <div class="logo">Nusa<span>Mart</span></div>
    <input id="search" class="search" type="search" placeholder="Cari kopi, batik, keyboard…">
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <div>
      <h1>Produk lokal pilihan,<br>diantar secepat sprint.</h1>
      <p>Katalog sampel yang ditenagai Rust + Axum di Civo Kubernetes. Klik produk untuk rekomendasi serupa.</p>
    </div>
    <div class="stats">
      <div class="stat"><b id="sProducts">0</b><small>Produk</small></div>
      <div class="stat"><b id="sCategories">0</b><small>Kategori</small></div>
      <div class="stat"><b id="sPod">…</b><small>Pod</small></div>
    </div>
  </section>

  <div id="chips" class="chips"></div>
  <div id="grid" class="grid"></div>
</main>

<footer>
  <div><span class="build"><i></i><span id="build">build …</span></span></div>
  API: <code>GET /api/products</code> · <code>GET /api/recommendations?product_id=</code> · <code>GET /health</code> · <code>GET /metrics</code>
</footer>

<div id="panel">
  <div class="drawer-bg" data-close></div>
  <aside class="drawer" aria-label="Rekomendasi">
    <h2><span id="panelTitle">Rekomendasi</span> <button data-close aria-label="Tutup">✕</button></h2>
    <div id="lines" class="lines"></div>
  </aside>
</div>

<div id="toast" class="toast"></div>

<script src="/app.js" defer></script>
</body>
</html>
